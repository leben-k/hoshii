 if(h==="/check"){document.title="表示チェック｜ほしいものガイド";const st=c=>{if(!c)return"空欄";const r=checkCode(c);return r.ok?"そのまま表示できます":"表示できません（"+r.why+"）"};
  app.innerHTML=`<div class="w">${ABAR()}<h1 class="ttl">表示チェック</h1><p class="note">スプレッドシートの各行を、サイトがどう読み取ったかを表示します。楽天のコードは、貼られたとおりに表示します。</p>${RAW.length?RAW.map((r,i)=>{if(!r[2])return"";const it=rowItem(r,i),hid=/^(×|x|非公開)$/i.test((r[1]||"").trim());return `<div class="ck"><b>${i+2}行目：${esc(it.title)}</b>${hid?"（非公開の行）":""}<br>カテゴリ：${esc(CATN[it.cat])}${it.catManual?"（スプレッドシートで指定）":"（自動で振り分け）"}<br>楽天のコード（E列）：${st(it.codeLink)}<br>画像URL（F列）：${st(it.codeImg)}${codeBlock(it)}</div>`}).join(""):`<p class="note">スプレッドシートを読み込めていません。</p>`}${ABAR(1)}</div>`;return}
 if(h==="/privacy"){document.title="プライバシーポリシー｜ほしいものガイド";app.innerHTML=`<div class="w">${ABAR()}${POLICY}${ABAR(1)}</div>`;return}
 if(h==="/about"||h==="/contact"){document.title="運営者情報｜ほしいものガイド";app.innerHTML=`<div class="w">${ABAR()}<h1 class="ttl">運営者情報</h1><dl class="info"><dt>運営者</dt><dd>地域情報室</dd><dt>サイト名</dt><dd>ほしいものガイド</dd><dt>個人情報について</dt><dd>個人運営につき、現在の世情から個人情報は記載していません。</dd></dl>${FORM}${ABAR(1)}</div>`;initForm();if(h==="/contact")document.getElementById("cform").scrollIntoView();return}
 const tagT=c=>`<a class="ctag" href="#/cat/${c}"><span aria-hidden="true">${CATI[c]}</span>${esc(CATN[c])}</a>`;
 const NOTE=`<p class="adnote">掲載している商品のリンク先は広告（アフィリエイト）です。購入はご自身の判断と責任でお願いします。運営者は一切責任を負いません。</p>`;
 const card=it=>`<article class="card" id="p-${it.id}">${tagT(it.cat)}<h3 class="ct" style="color:var(--c${it.cat%6})"><span class="ctx">${esc(it.title)}</span><span class="prl">PR</span></h3><p class="text clamp">${esc(it.text)}</p><div class="more-body" hidden>${codeBlock(it)}</div><button type="button" class="more-btn" aria-expanded="false" onclick="toggleMore(this)">続きを読む</button><a class="totoc" href="#toc" onclick="goTo('toc');return false">↑ 商品の見出し一覧に戻る</a></article>`;
 const cnt=c=>ITEMS.filter(x=>x.cat===c).length;
 const tocLi=li=>`<ul class="toc-l">${li.map(x=>`<li><a href="#p-${x.id}" onclick="return goTo('p-${x.id}')" style="color:var(--c${x.cat%6})">${esc(x.title)}</a></li>`).join("")}</ul>`;
 const chips=`<section class="cats" id="cats"><h2 class="lh">カテゴリから探す</h2><div class="chips">${CATN.map((n,c)=>{const k=cnt(c);if(c===OTHER&&!k)return"";return `<a class="chip${k?"":" zero"}" href="#/cat/${c}"><span class="ci" aria-hidden="true">${CATI[c]}</span><span class="cn">${esc(n).replace(/・/g,"・<wbr>")}<small>${k?k+"件":"準備中"}</small></span></a>`}).join("")}</div></section>`;
 const mc=h.match(/^\/cat\/(\d+)/);
 if(mc){const c=+mc[1];if(!(c>=0&&c<CATN.length)){location.hash="#/";return}
  const li=ITEMS.filter(x=>x.cat===c);document.title=CATN[c]+"｜ほしいものガイド";
  app.innerHTML=`<div class="w">${bar(false)}<h1 class="cath"><span aria-hidden="true">${CATI[c]}</span>${esc(CATN[c])}</h1><p class="catc">${li.length?li.length+"件の商品があります。":"このカテゴリの商品は、ただいま準備中です。"}</p>${li.length?`<section class="toc" id="toc"><h2 class="lh">商品の見出し一覧</h2><p class="toc-h">見出しを押すと、下の本文のその見出しまで移動します。</p>${tocLi(li)}</section>`:""}${li.length?NOTE:""}<div class="cards">${li.map(card).join("")}</div>${chips}${bar(false,1)}</div>`;return}
 if(!ITEMS.length){app.innerHTML=`<div class="w"><p class="empty">掲載準備中です。</p>${chips}</div>`;return}
 const m=h.match(/^\/item\/(.+)/),it=m&&ITEMS.find(i=>i.id===m[1]);
 if(it){setMode(true);document.title=it.title+"｜ほしいものガイド";
  const same=ITEMS.filter(x=>x!==it&&x.cat===it.cat);
  app.innerHTML=`<div class="w">${bar(false,0,"list","見出し一覧へ")}
  <article class="item">${tagT(it.cat)}<h1 style="color:var(--c${it.cat%6})"><span class="ctx">${esc(it.title)}</span><span class="prl">PR</span></h1><p class="text">${esc(it.text)}</p>${codeBlock(it)}<p class="note">リンク先は広告（アフィリエイト）です。購入はご自身の判断と責任でお願いします。運営者は一切責任を負いません。</p></article>
  <h2 class="lh" id="list">「${esc(CATN[it.cat])}」の見出し一覧</h2>${same.length?`<nav class="hl">${same.map(x=>`<a href="#/item/${x.id}" style="color:var(--c${x.cat%6})">${esc(x.title)}</a>`).join("")}</nav>`:`<p class="catc">このカテゴリの、ほかの商品はまだありません。</p>`}
  ${chips}${bar(false,1,"list","見出し一覧へ")}</div>`;return}
 setMode(false);document.title="ほしいものガイド";
 const groups=CATN.map((n,c)=>({c,li:ITEMS.filter(x=>x.cat===c)})).filter(g=>g.li.length);
 const toc=`<section class="toc" id="toc"><h2 class="lh">商品の見出し一覧</h2><p class="toc-h">見出しを押すと、下の本文のその見出しまで移動します。</p>${tocLi(groups.reduce((a,g)=>a.concat(g.li),[]))}</section>`;
 app.innerHTML=`<div class="w">${INTRO}${HOWTO}${chips}${SCENE}
 ${MORE}${bar(true,1)}</div>`}
function route(hh){route0(hh);try{initMore()}catch(e){}}
document.getElementById("yr").textContent=new Date().getFullYear();
window.addEventListener("hashchange",()=>{route();fixLinks()});
window.addEventListener("resize",()=>{try{initMore()}catch(e){}});
load().then(()=>{const a=document.getElementById("app"),B=a.dataset.base;
 if(B===undefined){route();return}
 if(SHEET_CSV_URL&&!LOADED)return;
 if(location.hash){route();fixLinks();return}
 const id=a.dataset.item;
 if(id&&!ITEMS.some(x=>x.id===id)){location.replace(B);return}
 const y=window.scrollY;route(id?"/item/"+id:"/");fixLinks();window.scrollTo(0,y)});
</script></body></html>
